<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PT Master Overlay</title>
    <style>
        body { margin: 0; background: #050a19; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .box { border: 2px solid #00f3ff; padding: 20px 40px; background: rgba(5, 10, 25, 0.9); border-radius: 12px; text-align: center; box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); animation: pulse 3s infinite; }
        h1 { color: #fff; font-size: 40px; margin: 0; text-shadow: 0 0 10px #00f3ff; }
        p { color: #00f3ff; font-size: 14px; margin: 5px 0 0 0; letter-spacing: 4px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>
<body>
    <div class="box">
        <h1>PT MASTER</h1>
        <p>LIVE GAMING</p>
    </div>
</body>
</html>
